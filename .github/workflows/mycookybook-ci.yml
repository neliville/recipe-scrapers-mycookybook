# Validation MyCookyBook avant fusion vers develop ou main.
# Déclenché uniquement par une pull request. Aucun secret, aucun SSH, aucun déploiement.
# Les fixtures *.testhtml upstream ne sont pas renormalisées ici : voir docs/GITATTRIBUTES_RECOMMENDED.md.

name: MyCookyBook CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: mycookybook-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            mycookybook_api/requirements.txt
            pyproject.toml

      - name: Require Python >= 3.11.5
        run: python -c 'import sys; raise SystemExit("Python >= 3.11.5 required, got %s" % sys.version if sys.version_info < (3, 11, 5) else 0)'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mycookybook_api/requirements.txt
          pip install -e .

      - name: Check dependencies
        run: pip check

      - name: cPanel whitelist planner tests
        run: python -m unittest discover -s scripts -t scripts -p 'test_cpanel_whitelist.py'

      - name: Flask contract tests
        run: python -m unittest discover -s mycookybook_api/tests -t .

      - name: Upstream library tests
        run: python -m unittest discover -s tests -t .
