name: cPanel auth check

on:
  push:
    branches:
      - ci/cpanel-auth-check

permissions:
  contents: read

jobs:
  check:
    name: List whitelist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List whitelist
        env:
          CPANEL_HOST: ${{ secrets.O2SWITCH_HOST }}
          CPANEL_USER: ${{ secrets.O2SWITCH_USER }}
          CPANEL_PASS: ${{ secrets.O2SWITCH_CPANEL_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CPANEL_HOST}" || -z "${CPANEL_USER}" || -z "${CPANEL_PASS}" ]]; then
            echo "secret_present=no"
            exit 1
          fi
          echo "secret_present=yes"
          body=$(mktemp)
          err=$(mktemp)
          trap 'rm -f "$body" "$err"' EXIT
          set +e
          http_code=$(
            curl -s --max-time 45 -o "$body" -w '%{http_code}' \
              --user "${CPANEL_USER}:${CPANEL_PASS}" \
              -- "https://${CPANEL_HOST}:2083/frontend/o2switch/o2switch-ssh-whitelist/index.live.php?r=list" \
              2>"$err"
          )
          curl_exit=$?
          set -e
          CPANEL_HTTP_CODE="$http_code" CPANEL_CURL_EXIT="$curl_exit" \
            python3 scripts/cpanel_auth_classify.py --body-file "$body"
          rm -f "$body" "$err"
