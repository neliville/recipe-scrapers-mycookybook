name: Deploy Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to o2switch staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get runner public IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Authorize runner and confirm whitelist
        env:
          CPANEL_HOST: ${{ secrets.O2SWITCH_CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.O2SWITCH_USER }}
          CPANEL_PASS: ${{ secrets.O2SWITCH_CPANEL_PASSWORD }}
          CPANEL_KEEP_IPS: ${{ secrets.O2SWITCH_KEEP_IPS }}
          CPANEL_RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
          CPANEL_SSH_PORT: ${{ secrets.O2SWITCH_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "${CPANEL_HOST}" || -z "${CPANEL_USER}" || -z "${CPANEL_PASS}" || -z "${CPANEL_RUNNER_IP}" || -z "${CPANEL_SSH_PORT}" ]]; then
            echo "secret_present=no"
            exit 1
          fi
          echo "secret_present=yes"
          login_body=$(mktemp)
          list_body=$(mktemp)
          change_body=$(mktemp)
          cookie=$(mktemp)
          token=$(mktemp)
          remove=$(mktemp)
          err=$(mktemp)
          chmod 600 "$login_body" "$list_body" "$change_body" "$cookie" "$token" "$remove" "$err"
          trap 'rm -f "$login_body" "$list_body" "$change_body" "$cookie" "$token" "$remove" "$err"' EXIT

          set +e
          login_code=$(
            curl -s --max-time 45 -c "$cookie" -o "$login_body" -w '%{http_code}' \
              --data-urlencode "user=${CPANEL_USER}" \
              --data-urlencode "pass=${CPANEL_PASS}" \
              -- "https://${CPANEL_HOST}:2083/login/?login_only=1" \
              2>"$err"
          )
          login_exit=$?
          set -e
          CPANEL_HTTP_CODE="$login_code" CPANEL_CURL_EXIT="$login_exit" \
            python3 scripts/cpanel_auth_classify.py login \
              --body-file "$login_body" \
              --cookie-file "$cookie" \
              --token-file "$token"

          list_whitelist() {
            set +e
            list_code=$(
              curl -s --max-time 45 -b "$cookie" -o "$list_body" -w '%{http_code}' \
                -- "https://${CPANEL_HOST}:2083$(cat "$token")/frontend/o2switch/o2switch-ssh-whitelist/index.live.php?r=list" \
                2>"$err"
            )
            list_exit=$?
            set -e
          }

          list_whitelist
          action=$(
            CPANEL_HTTP_CODE="$list_code" CPANEL_CURL_EXIT="$list_exit" \
              python3 scripts/cpanel_auth_classify.py plan \
                --body-file "$list_body" \
                --remove-file "$remove"
          )
          echo "$action"

          apply_change() {
            set +e
            change_code=$(
              curl -s --max-time 45 -b "$cookie" -o "$change_body" -w '%{http_code}' \
                "$@" \
                2>"$err"
            )
            change_exit=$?
            set -e
            CPANEL_HTTP_CODE="$change_code" CPANEL_CURL_EXIT="$change_exit" \
              python3 scripts/cpanel_auth_classify.py mutation --body-file "$change_body"
          }

          base="https://${CPANEL_HOST}:2083$(cat "$token")/frontend/o2switch/o2switch-ssh-whitelist/index.live.php"
          if [[ "$action" == "action=prune_then_add" ]]; then
            while IFS=$'\t' read -r address direction; do
              [[ -n "$address" && -n "$direction" ]] || continue
              apply_change -G \
                --data-urlencode "r=remove" \
                --data-urlencode "address=${address}" \
                --data-urlencode "direction=${direction}" \
                --data-urlencode "port=${CPANEL_SSH_PORT}" \
                -- "$base"
            done < "$remove"
          fi
          if [[ "$action" == "action=add" || "$action" == "action=prune_then_add" ]]; then
            apply_change -X POST \
              --data-urlencode "whitelist[address]=${CPANEL_RUNNER_IP}" \
              --data-urlencode "whitelist[port]=${CPANEL_SSH_PORT}" \
              -- "${base}?r=add"
          elif [[ "$action" != "action=already_present" ]]; then
            echo "whitelist_plan_rejected"
            exit 1
          fi

          list_whitelist
          CPANEL_HTTP_CODE="$list_code" CPANEL_CURL_EXIT="$list_exit" \
            python3 scripts/cpanel_auth_classify.py confirm --body-file "$list_body"
          rm -f "$login_body" "$list_body" "$change_body" "$cookie" "$token" "$remove" "$err"

      - name: Confirm runner whitelist
        run: echo "whitelist_confirmed=yes"

      - name: Wait until SSH accepts connections
        env:
          SSH_HOST: ${{ secrets.O2SWITCH_HOST }}
          SSH_PORT: ${{ secrets.O2SWITCH_PORT }}
        run: |
          set -euo pipefail
          echo "Checking SSH reachability only. Key authentication happens in the next step."
          for attempt in $(seq 1 12); do
            if timeout 8 bash -c "cat < /dev/null > /dev/tcp/${SSH_HOST}/${SSH_PORT}" 2>/dev/null; then
              echo "ssh_port_open=yes attempt=${attempt}"
              exit 0
            fi
            echo "ssh_port_open=no attempt=${attempt}"
            sleep 5
          done
          echo "ssh_port_unavailable"
          exit 1

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.O2SWITCH_HOST }}
          username: ${{ secrets.O2SWITCH_USER }}
          port: ${{ secrets.O2SWITCH_PORT }}
          key: ${{ secrets.O2SWITCH_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            bash /home/iwob6566/apps/recipe-scrapers-mycookybook/scripts/deploy-staging.sh
